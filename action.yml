name: single_header
description: Generate a single-header C++ amalgamation with the single_header CLI.
author: single_header contributors

branding:
  icon: file-text
  color: blue

inputs:
  backend:
    description: Package to install, lightweight (default) or clang (Linux x64, includes Clang resources/runtime).
    default: lightweight
    required: false
  executable:
    description: Optional existing CLI executable (for a locally built Clang backend). Skips download.
    required: false
  version:
    description: Release tag containing the CLI binary. Defaults to the action ref, so use a release tag such as 1.1.0.
    required: false
  repository:
    description: Repository to download release assets from. Defaults to this action repository.
    required: false
  include-root:
    description: One or more include roots, separated by newlines.
    required: false
  output:
    description: Output header path.
    required: false
  config:
    description: Optional JSON config file path. If omitted, the CLI discovers ./single_header.json when present.
    required: false
  source:
    description: Extra source files, directories, or glob patterns, separated by newlines.
    required: false
  rewrite-macro:
    description: Macro rewrites as NAME=VALUE entries, separated by newlines.
    required: false
  implementation-marker:
    description: Marker replaced by stripped source text.
    required: false
  entry:
    description: Optional top-level header path.
    required: false
  deduplicate-includes:
    description: Optional true or false; hoist unguarded literal includes after include-guard and remove repeats. Omit to use JSON/default off.
    required: false
  include-guard:
    description: Outer header guard macro name, required when include deduplication is enabled.
    required: false
  allow-mixed-include:
    description: Literal include operands (including angle or quote delimiters), one per line; waive only the mixed-guard audit, still hoisting normally.
    required: false
  merge-namespaces:
    description: Optional true or false; merge adjacent ordinary named namespaces recursively. Review external structural macros before enabling. Omit to use JSON/default off.
    required: false
  function-stitching:
    description: Optional off, free, methods, or all. Requires a Clang-enabled executable for stitching.
    required: false
  inline-functions:
    description: Optional true or false; add inline to ordinary external function definitions. Requires Clang and complete compilation contexts. Omit to use JSON/default off.
    required: false
  compilation-database:
    description: Optional compile_commands.json path or directory.
    required: false
  frontend-arg:
    description: Complete Clang arguments, one argument per line, instead of a compilation database.
    required: false
  jobs:
    description: Optional number of compiler contexts analyzed concurrently (1-1024). Omit to use JSON/default hardware concurrency.
    required: false
  stitching-report:
    description: Optional JSON report path, distinct from inputs and output.
    required: false
  inline-annotation:
    description: Allowed empty/inline annotation macro names, one per line.
    required: false
  run:
    description: Set to false to install the CLI without running it.
    required: false
    default: "true"

outputs:
  executable:
    description: Path to the installed or supplied single_header executable.
    value: ${{ steps.install.outputs.executable }}

runs:
  using: composite
  steps:
    - name: Install single_header
      id: install
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_EXECUTABLE: ${{ inputs.executable }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        $ErrorActionPreference = "Stop"

        if ($env:INPUT_EXECUTABLE) {
          $existing = (Resolve-Path -LiteralPath $env:INPUT_EXECUTABLE).Path
          "executable=$existing" >> $env:GITHUB_OUTPUT
          exit 0
        }

        $version = $env:INPUT_VERSION
        if (-not $version) {
          $version = $env:ACTION_REF
        }
        if (-not $version) {
          throw "No single_header release version was provided. Use this action at a release tag, or set the 'version' input."
        }

        $repository = $env:INPUT_REPOSITORY
        if (-not $repository) {
          $repository = $env:ACTION_REPOSITORY
        }
        if (-not $repository) {
          throw "No single_header release repository was provided."
        }

        $os = $env:RUNNER_OS_NAME
        $arch = $env:RUNNER_ARCH_NAME
        $extension = "tar.gz"
        $binaryName = "single_header"

        if ($os -eq "Linux" -and $arch -eq "X64") {
          $target = "linux-x86_64"
        } elseif ($os -eq "Windows" -and $arch -eq "X64") {
          $target = "windows-x86_64"
          $extension = "zip"
          $binaryName = "single_header.exe"
        } elseif ($os -eq "macOS" -and $arch -eq "X64") {
          $target = "macos-x86_64"
        } elseif ($os -eq "macOS" -and $arch -eq "ARM64") {
          $target = "macos-arm64"
        } else {
          throw "Unsupported runner target: $os/$arch"
        }

        $backend = $env:INPUT_BACKEND
        if (-not $backend) { $backend = "lightweight" }
        if ($backend -notin @("lightweight", "clang")) {
          throw "Unknown single_header backend: $backend"
        }
        if ($backend -eq "clang") {
          if ($target -ne "linux-x86_64") { throw "The clang package currently supports Linux x64." }
          $target += "-clang"
        }
        $assetName = "single_header-$version-$target.$extension"
        $downloadUrl = "https://github.com/$repository/releases/download/$version/$assetName"
        $installDir = Join-Path $env:RUNNER_TEMP "single_header-action"
        $archivePath = Join-Path $env:RUNNER_TEMP $assetName

        Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null

        Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath

        if ($extension -eq "zip") {
          Expand-Archive -LiteralPath $archivePath -DestinationPath $installDir -Force
        } else {
          tar -xzf $archivePath -C $installDir
        }

        $binary = Get-ChildItem -LiteralPath $installDir -Recurse -File -Filter $binaryName |
          Select-Object -First 1
        if (-not $binary) {
          throw "Archive did not contain $binaryName"
        }

        if ($os -ne "Windows") {
          chmod +x $binary.FullName
        }

        "executable=$($binary.FullName)" >> $env:GITHUB_OUTPUT

    - name: Run single_header
      if: ${{ inputs.run == 'true' }}
      shell: pwsh
      env:
        SINGLE_HEADER_EXECUTABLE: ${{ steps.install.outputs.executable }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_INCLUDE_ROOT: ${{ inputs.include-root }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_REWRITE_MACRO: ${{ inputs.rewrite-macro }}
        INPUT_IMPLEMENTATION_MARKER: ${{ inputs.implementation-marker }}
        INPUT_ENTRY: ${{ inputs.entry }}
        INPUT_DEDUPLICATE_INCLUDES: ${{ inputs.deduplicate-includes }}
        INPUT_INCLUDE_GUARD: ${{ inputs.include-guard }}
        INPUT_ALLOW_MIXED_INCLUDE: ${{ inputs.allow-mixed-include }}
        INPUT_MERGE_NAMESPACES: ${{ inputs.merge-namespaces }}
        INPUT_FUNCTION_STITCHING: ${{ inputs.function-stitching }}
        INPUT_INLINE_FUNCTIONS: ${{ inputs.inline-functions }}
        INPUT_COMPILATION_DATABASE: ${{ inputs.compilation-database }}
        INPUT_FRONTEND_ARG: ${{ inputs.frontend-arg }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_STITCHING_REPORT: ${{ inputs.stitching-report }}
        INPUT_INLINE_ANNOTATION: ${{ inputs.inline-annotation }}
      run: |
        $ErrorActionPreference = "Stop"

        function Add-MultilineArgs {
          param(
            [string[]] $ArgsList,
            [string] $Flag,
            [string] $Values
          )

          if (-not $Values) {
            return $ArgsList
          }

          foreach ($line in ($Values -split "\r?\n")) {
            $value = $line.Trim()
            if ($value) {
              $ArgsList += @($Flag, $value)
            }
          }

          return $ArgsList
        }

        $toolArgs = @()
        if ($env:INPUT_CONFIG) {
          $toolArgs += @("--config", $env:INPUT_CONFIG)
        }
        $toolArgs = Add-MultilineArgs $toolArgs "--include-root" $env:INPUT_INCLUDE_ROOT
        if ($env:INPUT_OUTPUT) {
          $toolArgs += @("--output", $env:INPUT_OUTPUT)
        }
        $toolArgs = Add-MultilineArgs $toolArgs "--source" $env:INPUT_SOURCE
        $toolArgs = Add-MultilineArgs $toolArgs "--rewrite-macro" $env:INPUT_REWRITE_MACRO

        if ($env:INPUT_IMPLEMENTATION_MARKER) {
          $toolArgs += @("--implementation-marker", $env:INPUT_IMPLEMENTATION_MARKER)
        }
        if ($env:INPUT_ENTRY) {
          $toolArgs += @("--entry", $env:INPUT_ENTRY)
        }
        if ($env:INPUT_DEDUPLICATE_INCLUDES) {
          switch ($env:INPUT_DEDUPLICATE_INCLUDES) {
            "true" { $toolArgs += "--deduplicate-includes" }
            "false" { $toolArgs += "--no-deduplicate-includes" }
            default { throw "deduplicate-includes expects true or false" }
          }
        }
        if ($env:INPUT_INCLUDE_GUARD) {
          $toolArgs += @("--include-guard", $env:INPUT_INCLUDE_GUARD)
        }
        $toolArgs = Add-MultilineArgs $toolArgs "--allow-mixed-include" $env:INPUT_ALLOW_MIXED_INCLUDE
        if ($env:INPUT_MERGE_NAMESPACES) {
          switch ($env:INPUT_MERGE_NAMESPACES) {
            "true" { $toolArgs += "--merge-namespaces" }
            "false" { $toolArgs += "--no-merge-namespaces" }
            default { throw "merge-namespaces expects true or false" }
          }
        }
        if ($env:INPUT_FUNCTION_STITCHING) {
          $toolArgs += @("--function-stitching", $env:INPUT_FUNCTION_STITCHING)
        }
        if ($env:INPUT_INLINE_FUNCTIONS) {
          switch ($env:INPUT_INLINE_FUNCTIONS) {
            "true" { $toolArgs += "--inline-functions" }
            "false" { $toolArgs += "--no-inline-functions" }
            default { throw "inline-functions expects true or false" }
          }
        }
        if ($env:INPUT_COMPILATION_DATABASE) {
          $toolArgs += @("--compilation-database", $env:INPUT_COMPILATION_DATABASE)
        }
        $toolArgs = Add-MultilineArgs $toolArgs "--frontend-arg" $env:INPUT_FRONTEND_ARG
        $toolArgs = Add-MultilineArgs $toolArgs "--inline-annotation" $env:INPUT_INLINE_ANNOTATION
        if ($env:INPUT_JOBS) {
          $toolArgs += @("--jobs", $env:INPUT_JOBS)
        }
        if ($env:INPUT_STITCHING_REPORT) {
          $toolArgs += @("--stitching-report", $env:INPUT_STITCHING_REPORT)
        }

        & $env:SINGLE_HEADER_EXECUTABLE @toolArgs
